<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>DescarteIA — preview local</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18/jsx-dev-runtime",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react"
    }
  }
  </script>

  <script src="./shims.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    const res = await fetch("../DescarteIA.jsx");
    const source = await res.text();
    const { code } = Babel.transform(source, {
      presets: ["react"],
      filename: "DescarteIA.jsx",
    });
    const blobUrl = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    const [{ default: DescarteIA }, React, { createRoot }] = await Promise.all([
      import(blobUrl),
      import("react"),
      import("react-dom/client"),
    ]);

    createRoot(document.getElementById("root")).render(React.createElement(DescarteIA));
  </script>
</body>
</html>
